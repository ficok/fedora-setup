# (i3 had `exec source ~/.zshrc` here. It had no effect on other programs; PATH for the session
#  now comes from ~/.config/sway/env, loaded by the sway-session login wrapper.)

# Terminal
bindsym $mod+Return exec kitty
# App launcher  (`launcher` = rofi with your launcher.rasi, or fuzzel if rofi has no Wayland support)
bindsym $mod+space exec launcher drun

# Command launcher
bindsym $mod+c exec launcher run

# Switch monitors
# Your old ~/.scripts/switch_to_* scripts use X11 tools (xrandr) and cannot work on Wayland.
# `switch-display` (dotfiles/bin) replaces them: it enables the outputs matching a regex and disables the rest.
# Wayland names: eDP-1, DP-1, HDMI-A-1 ... (check with: swaymsg -t get_outputs)
bindsym $mod+shift+F1 exec switch-display '^eDP'
bindsym $mod+F1 exec switch-display '^DP-'
bindsym $mod+F2 exec switch-display '^HDMI'
bindsym $mod+F3 exec switch-display all
bindsym $mod+F4 exec switch-display '^DVI'

# Switch keymaps (setxkbmap -> sway's input layouts, defined in wayland.conf: us, rs latin, rs cyrillic)
bindsym $mod+F12 input type:keyboard xkb_switch_layout 0
bindsym $mod+F11 input type:keyboard xkb_switch_layout 1
bindsym $mod+shift+F11 input type:keyboard xkb_switch_layout 2
