# Wallpaper (was: nitrogen --restore). Set one with: wallpaper ~/Pictures/photo.jpg
exec_always wallpaper restore

# Bars (was: polybar double/launch.sh). Top + bottom bar, see ~/.config/eww/eww.yuck
exec eww-launch

# Audio: PipeWire starts on demand (was: pulseaudio). Compositing, shadows, rounded corners
# (was: picom) are not needed: sway composites by itself. Rounded corners would need SwayFX.

# Your own script from the i3 setup. Enable it after checking it for X11-only commands (xset, xrandr, ...):
# exec autostart.sh

# --- Wayland additions ---
exec systemctl --user import-environment WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP=sway
exec mako
exec nm-applet --indicator
exec blueman-applet
exec wl-paste --type text  --watch cliphist store
exec wl-paste --type image --watch cliphist store
exec /usr/libexec/polkit-gnome-authentication-agent-1
exec gsettings set org.gnome.desktop.interface color-scheme prefer-dark

# Lock after $lock_timeout s, screen off after $screen_off_timeout s (set at the top of ~/.config/sway/config)
exec swayidle -w timeout $lock_timeout 'swaylock -f' timeout $screen_off_timeout 'swaymsg "output * power off"' resume 'swaymsg "output * power on"' before-sleep 'swaylock -f' lock 'swaylock -f'
