# New in the Sway setup: things that were X11 tools in i3, and Wayland additions.

# --- keyboard layouts (replaces setxkbmap; switching is bound in app_shortcuts.conf) ---
# group 0 = us, group 1 = Serbian latin, group 2 = Serbian cyrillic
input type:keyboard {
    xkb_layout "us,rs,rs"
    xkb_variant ",latin,"
}

# --- touchpad (uncomment on a laptop) ---
# input type:touchpad {
#     tap enabled
#     natural_scroll disabled
#     dwt enabled
# }

# --- lock, screenshot, clipboard history, eww ---
bindsym $mod+Escape exec loginctl lock-session
bindsym Print exec grim -g "$(slurp)" - | swappy -f -
bindsym $mod+Shift+v exec cliphist list | rofi -dmenu | cliphist decode | wl-copy
bindsym $mod+Shift+b exec eww reload

# --- media keys ---
bindsym XF86AudioPlay exec playerctl play-pause
bindsym XF86AudioNext exec playerctl next
bindsym XF86AudioPrev exec playerctl previous
